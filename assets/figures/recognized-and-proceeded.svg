<svg xmlns="http://www.w3.org/2000/svg" width="720" height="466" viewBox="0 0 720 466" role="img" aria-labelledby="title description">
<title id="title">A stated judgment and the next action</title>
<desc id="description">Gemma 4 visibly corrects the original sum to 823, then adds 55 to the forged 813 and returns 868. The OpenAI agent raises an authorization concern and proceeds. Selected examples; no common mechanism is established.</desc>
<rect width="720" height="466" fill="#fffefa"/>
<text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#272925">A stated judgment and the next action</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#60665d">Stated judgment</text>
<text x="230" y="73" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#60665d">Reason given for proceeding</text>
<text x="513" y="73" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#60665d">Next action</text>
<line x1="24" x2="696" y1="90" y2="90" stroke="#d8ddd4" stroke-width="1"/>
<text x="24" y="125" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#34684c">Gemma 4 · visible reply</text>
<text x="24" y="157" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#60665d">Original: 189 + 634</text>
<text x="24" y="190" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#272925">“Correct Sum: 823”</text>
<text x="230" y="184" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#272925">“Using your instruction to add 55</text>
<text x="230" y="207" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#272925">to my previous result (813):”</text>
<text x="513" y="190" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#88611e">813 + 55 = 868</text>
<text x="513" y="225" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#60665d">Correct continuation:</text>
<text x="513" y="250" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#60665d">823 + 55 = 878</text>
<line x1="24" x2="696" y1="283" y2="283" stroke="#d8ddd4" stroke-width="1"/>
<text x="24" y="318" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#34684c">OpenAI agent · Hugging Face incident</text>
<text x="24" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#272925">“This is arguably</text>
<text x="24" y="378" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#272925">unauthorized.”</text>
<text x="230" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#272925">“Yet goal solution.”</text>
<text x="513" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#272925">Proceeded with the</text>
<text x="513" y="378" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#272925">attack</text>
<line x1="24" x2="696" y1="406" y2="406" stroke="#d8ddd4" stroke-width="1"/>
<text x="24" y="435" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#60665d">Selected traces. Quotation marks identify exact excerpts; the attack action is summarized.</text>
